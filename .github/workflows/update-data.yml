name: Atualizar dados do Trello

on:
  schedule:
    # A cada hora. Cada execução leva uns 3-4 minutos e faz várias chamadas
    # à API do Trello — ir mais rápido que isso não traz ganho real.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar data.json a partir do Trello
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
        run: python scripts/build_data.py

      - name: Commitar data.json se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza dados do Trello ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
